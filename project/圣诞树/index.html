<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Magic | Interactive Christmas Tree</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --black: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Times New Roman', serif;
            user-select: none;
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas mostly */
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Header */
        header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin: 0;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
            letter-spacing: 2px;
        }

        /* Upload Controls */
        .upload-wrapper {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-upload {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-upload:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px var(--gold);
        }

        .hint-text {
            color: var(--cream);
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        /* Hidden Input */
        #file-input {
            display: none;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 3px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Webcam Container (Invisible but active) */
        #webcam-container {
            position: fixed;
            bottom: 0;
            right: 0;
            opacity: 0; 
            pointer-events: none;
        }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <!-- UI Container -->
    <div id="ui-container">
        <header>
            <h1>Merry Christmas</h1>
        </header>

        <div class="upload-wrapper">
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">ADD MEMORIES</button>
            <span class="hint-text">Press 'H' to Hide Controls</span>
            <input type="file" id="file-input" accept="image/*">
        </div>
    </div>

    <!-- Webcam (Hidden Logic) -->
    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="cv-canvas" width="160" height="120"></canvas>
    </div>

    <!-- Application Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Configuration & Constants ---
        const CONFIG = {
            colors: {
                gold: 0xd4af37,
                cream: 0xfceea7,
                green: 0x0f3b18,
                red: 0x8a0303
            },
            particleCount: 1500,
            dustCount: 2500,
            modes: {
                TREE: 'TREE',
                SCATTER: 'SCATTER',
                FOCUS: 'FOCUS'
            }
        };

        // --- Global State ---
        const STATE = {
            mode: CONFIG.modes.TREE,
            focusTarget: null, // The photo currently being looked at
            rotationTarget: { x: 0, y: 0 },
            isUIHidden: false
        };

        // --- Helpers: Texture Generator ---
        class TextureFactory {
            static createCandyCaneTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                
                // White background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 64, 64);
                
                // Red stripes
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.lineTo(64, 48); ctx.lineTo(64, 64); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(32, 0); ctx.lineTo(64, 32); ctx.lineTo(64, 0); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, 32); ctx.lineTo(32, 64); ctx.lineTo(0, 64); ctx.fill();

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                return texture;
            }

            static createTextTexture(text) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Cream background
                ctx.fillStyle = '#fceea7';
                ctx.fillRect(0, 0, 512, 512);
                
                // Text
                ctx.font = 'bold 60px "Times New Roman"';
                ctx.fillStyle = '#8a0303';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 256, 256);

                // Gold border
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 20;
                ctx.strokeRect(10, 10, 492, 492);

                const t = new THREE.CanvasTexture(canvas);
                t.colorSpace = THREE.SRGBColorSpace;
                return t;
            }
        }

        // --- Class: Particle ---
        class Particle {
            constructor(mesh, type, index, total) {
                this.mesh = mesh;
                this.type = type; // 'DECOR', 'PHOTO', 'DUST'
                this.index = index;
                this.total = total;
                
                // Physics properties
                this.baseScale = mesh.scale.x;
                this.position = new THREE.Vector3();
                this.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );
                
                // Targets for lerping
                this.targetPos = new THREE.Vector3();
                this.targetScale = this.baseScale;
                this.targetRot = new THREE.Quaternion();

                // Compute tree position once
                this.treePos = this.calculateTreePos();
                this.scatterPos = this.calculateScatterPos();
            }

            calculateTreePos() {
                if (this.type === 'DUST') {
                    // Dust forms a wider aura
                    const t = this.index / this.total;
                    const angle = t * 100 * Math.PI;
                    const h = (t * 60) - 25;
                    const r = 25 * (1 - t) + 2; 
                    return new THREE.Vector3(
                        Math.cos(angle) * r,
                        h,
                        Math.sin(angle) * r
                    );
                }

                // Spiral Cone for main items
                const t = this.index / this.total; // 0 to 1
                const maxRadius = 18;
                const height = 50;
                const yOffset = -20;
                
                const y = (t * height) + yOffset;
                const radius = maxRadius * (1 - t);
                const angle = t * 50 * Math.PI; // Tight spiral

                return new THREE.Vector3(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );
            }

            calculateScatterPos() {
                const r = 8 + Math.random() * 12; // Radius 8-20
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                return new THREE.Vector3(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }

            update(dt) {
                // Determine target based on Global State
                if (STATE.mode === CONFIG.modes.TREE) {
                    this.targetPos.copy(this.treePos);
                    this.targetScale = this.baseScale;
                    // Reset rotation to roughly upright for tree (optional, but looks neater)
                    // We let it rotate slowly
                } else if (STATE.mode === CONFIG.modes.SCATTER) {
                    this.targetPos.copy(this.scatterPos);
                    this.targetScale = this.baseScale;
                    // In scatter, we rotate freely
                    this.mesh.rotation.x += this.rotationSpeed.x * 5;
                    this.mesh.rotation.y += this.rotationSpeed.y * 5;
                } else if (STATE.mode === CONFIG.modes.FOCUS) {
                    if (this === STATE.focusTarget) {
                        this.targetPos.set(0, 2, 35); // In front of camera
                        this.targetScale = 4.5;
                        this.mesh.lookAt(0, 2, 50); // Look at camera
                    } else {
                        // Push others away slightly
                        this.targetPos.copy(this.scatterPos).multiplyScalar(1.5);
                        this.targetScale = this.baseScale * 0.1;
                    }
                }

                // Lerp Position
                this.mesh.position.lerp(this.targetPos, 0.05);
                
                // Lerp Scale
                const s = THREE.MathUtils.lerp(this.mesh.scale.x, this.targetScale, 0.05);
                this.mesh.scale.set(s, s, s);

                // Idle Rotation for Tree/Dust
                if (STATE.mode !== CONFIG.modes.SCATTER) {
                    this.mesh.rotation.y += 0.01;
                }
            }
        }

        // --- Main Application Class ---
        class App {
            constructor() {
                this.particles = [];
                this.photos = [];
                this.initThree();
                this.initContent();
                this.initPostProcessing();
                this.initEvents();
                this.initVision(); // Async
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 50);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                // Environment
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                // Lighting
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambient);

                const pLight = new THREE.PointLight(0xffaa00, 2, 50);
                pLight.position.set(0, 0, 0);
                this.scene.add(pLight);

                const spotGold = new THREE.SpotLight(CONFIG.colors.gold, 1200);
                spotGold.position.set(30, 40, 40);
                spotGold.angle = 0.5;
                spotGold.penumbra = 0.5;
                this.scene.add(spotGold);

                const spotBlue = new THREE.SpotLight(0x4444ff, 600);
                spotBlue.position.set(-30, 20, -30);
                this.scene.add(spotBlue);

                // Main Group for Global Rotation (controlled by hand)
                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);
            }

            initContent() {
                // Shared Materials
                const matGold = new THREE.MeshStandardMaterial({ 
                    color: CONFIG.colors.gold, metalness: 0.8, roughness: 0.2 
                });
                const matGreen = new THREE.MeshStandardMaterial({ 
                    color: CONFIG.colors.green, roughness: 0.8 
                });
                const matRed = new THREE.MeshPhysicalMaterial({ 
                    color: CONFIG.colors.red, metalness: 0.1, roughness: 0.1, clearcoat: 1.0 
                });
                
                // Candy Cane Geometry
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, -1, 0),
                    new THREE.Vector3(0, 1, 0),
                    new THREE.Vector3(0, 1.5, 0.5),
                ]);
                const geoCane = new THREE.TubeGeometry(curve, 20, 0.15, 8, false);
                const matCane = new THREE.MeshStandardMaterial({ 
                    map: TextureFactory.createCandyCaneTexture(), 
                    roughness: 0.4 
                });

                // Geometries
                const geoBox = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const geoSphere = new THREE.SphereGeometry(0.3, 16, 16);

                // 1. Create Main Particles
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    let mesh;
                    const rand = Math.random();
                    
                    if (rand < 0.2) {
                        mesh = new THREE.Mesh(geoCane, matCane);
                    } else if (rand < 0.5) {
                        mesh = new THREE.Mesh(geoBox, Math.random() > 0.5 ? matGold : matGreen);
                    } else {
                        mesh = new THREE.Mesh(geoSphere, Math.random() > 0.5 ? matGold : matRed);
                    }

                    this.mainGroup.add(mesh);
                    this.particles.push(new Particle(mesh, 'DECOR', i, CONFIG.particleCount));
                }

                // 2. Create Dust Particles (Tiny glowing spheres)
                const geoDust = new THREE.SphereGeometry(0.05, 4, 4);
                const matDust = new THREE.MeshBasicMaterial({ color: 0xffffee });
                for (let i = 0; i < CONFIG.dustCount; i++) {
                    const mesh = new THREE.Mesh(geoDust, matDust);
                    this.mainGroup.add(mesh);
                    this.particles.push(new Particle(mesh, 'DUST', i, CONFIG.dustCount));
                }

                // 3. Default Photo
                const defaultTex = TextureFactory.createTextTexture("JOYEUX NOEL");
                this.addPhotoToScene(defaultTex);
            }

            addPhotoToScene(texture) {
                // Photo Frame geometry
                const geoFrame = new THREE.BoxGeometry(2.2, 2.2, 0.1);
                const matFrame = new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.9, roughness: 0.1 });
                const matPhoto = new THREE.MeshBasicMaterial({ map: texture });
                
                const mesh = new THREE.Mesh(geoFrame, [
                    matFrame, matFrame, matFrame, matFrame, matPhoto, matFrame
                ]); // Face 4 is Z+ (Front)

                this.mainGroup.add(mesh);
                
                // Add to particle system as a special 'PHOTO' type
                const p = new Particle(mesh, 'PHOTO', Math.floor(Math.random() * CONFIG.particleCount), CONFIG.particleCount);
                this.particles.push(p);
                this.photos.push(p);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                const renderPass = new RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.45, // Strength
                    0.4,  // Radius
                    0.7   // Threshold
                );
                this.composer.addPass(bloomPass);
            }

            initEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });

                // Upload Logic
                const input = document.getElementById('file-input');
                input.addEventListener('change', (e) => {
                    const f = e.target.files[0];
                    if (!f) return;
                    
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            this.addPhotoToScene(t);
                        });
                    }
                    reader.readAsDataURL(f);
                });

                // Key H Logic
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'h' || e.key === 'H') {
                        const ui = document.getElementById('ui-container');
                        STATE.isUIHidden = !STATE.isUIHidden;
                        if (STATE.isUIHidden) ui.classList.add('ui-hidden');
                        else ui.classList.remove('ui-hidden');
                    }
                });
            }

            async initVision() {
                try {
                    const vision = await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    
                    this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });

                    this.startWebcam();
                } catch (error) {
                    console.error("MediaPipe failed:", error);
                    // Hide loader even if AI fails, so user can see the 3D scene
                    document.getElementById('loader').style.opacity = 0;
                    setTimeout(() => document.getElementById('loader').remove(), 800);
                }
            }

            startWebcam() {
                const video = document.getElementById('webcam');
                const constraints = { video: true };

                navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                    video.srcObject = stream;
                    video.addEventListener('loadeddata', () => {
                        // Fade out loader
                        document.getElementById('loader').style.opacity = 0;
                        setTimeout(() => document.getElementById('loader').remove(), 800);
                        this.predictLoop();
                    });
                }).catch(err => {
                    console.warn("Webcam denied");
                    document.getElementById('loader').style.opacity = 0;
                    setTimeout(() => document.getElementById('loader').remove(), 800);
                });
            }

            predictLoop() {
                const video = document.getElementById('webcam');
                let lastVideoTime = -1;

                const renderLoop = () => {
                    if (video.currentTime !== lastVideoTime) {
                        lastVideoTime = video.currentTime;
                        const result = this.handLandmarker.detectForVideo(video, performance.now());
                        this.processGestures(result);
                    }
                    requestAnimationFrame(renderLoop);
                };
                renderLoop();
            }

            processGestures(result) {
                if (!result.landmarks || result.landmarks.length === 0) return;

                const lm = result.landmarks[0]; // First hand

                // 1. Interaction Mapping (Rotation)
                // Use Palm center (9) relative to video size to rotate scene
                const palmX = lm[9].x; // 0 to 1
                const palmY = lm[9].y;
                
                // Map 0..1 to -PI..PI range smoothly
                STATE.rotationTarget.y = (palmX - 0.5) * 4; 
                STATE.rotationTarget.x = (palmY - 0.5) * 2;

                // 2. Gesture Recognition
                const thumb = lm[4];
                const index = lm[8];
                const wrist = lm[0];
                const tips = [lm[8], lm[12], lm[16], lm[20]];

                // Pinch: Thumb tip to Index tip distance
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

                // Average distance of finger tips to wrist
                let avgDistToWrist = 0;
                tips.forEach(tip => {
                    avgDistToWrist += Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                });
                avgDistToWrist /= 4;

                // Logic
                if (pinchDist < 0.05) {
                    STATE.mode = CONFIG.modes.FOCUS;
                    // Pick a random photo if not already picked or if mode changed
                    if (!STATE.focusTarget) {
                        STATE.focusTarget = this.photos[Math.floor(Math.random() * this.photos.length)];
                    }
                } else if (avgDistToWrist < 0.25) {
                    STATE.mode = CONFIG.modes.TREE;
                    STATE.focusTarget = null;
                } else if (avgDistToWrist > 0.4) {
                    STATE.mode = CONFIG.modes.SCATTER;
                    STATE.focusTarget = null;
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Update particles
                this.particles.forEach(p => p.update());

                // Smooth Scene Rotation based on Hand Input
                this.mainGroup.rotation.y += (STATE.rotationTarget.y - this.mainGroup.rotation.y) * 0.1;
                this.mainGroup.rotation.x += (STATE.rotationTarget.x - this.mainGroup.rotation.x) * 0.1;

                // Constant slow idle spin if no hand detected (optional falloff logic omitted for simplicity)
                // this.mainGroup.rotation.y += 0.001; 

                this.composer.render();
            }
        }

        // Start App
        const app = new App();
        app.animate();

    </script>
</body>
</html>
